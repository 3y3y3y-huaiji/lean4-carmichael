name: Lean 4 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL --retry 5 --retry-connrefused https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean & Lake Toolchain
        run: |
          lean --version
          lake --version

      - name: Fetch Mathlib Cache
        run: lake exe cache get

      - name: Lake Build
        run: |
          lake build -KwarningAsError=true

      - name: Strict Verification of All Modules
        run: |
          lake env lean -D warningAsError=true Carmichael.lean
          lake env lean -D warningAsError=true Carmichael/Korselt.lean
          lake env lean -D warningAsError=true Carmichael/Smallest.lean
          lake env lean -D warningAsError=true Carmichael/Poulet.lean
          lake env lean -D warningAsError=true Carmichael/StrongPsp.lean
          lake env lean -D warningAsError=true Carmichael/StrongPspMulti.lean

      - name: Kernel Axioms Verification
        run: |
          cat << 'EOF' > check_axioms.lean
          import Carmichael
          import Carmichael.Korselt
          import Carmichael.Smallest
          import Carmichael.Poulet
          import Carmichael.StrongPsp
          import Carmichael.StrongPspMulti

          #print axioms Nat.carmichael_561
          #print axioms Nat.carmichael_iff_korselt
          #print axioms Nat.not_isCarmichael_of_lt_561
          #print axioms Nat.isCarmichael_min
          #print axioms Nat.smallest_strong_psp_two
          #print axioms Nat.strong_psp_2047
          #print axioms Nat.smallest_strong_psp_two_three
          #print axioms Nat.strong_psp_two_three_1373653
          EOF
          OUTPUT=$(lake env lean check_axioms.lean)
          echo "Axioms check output:"
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "sorryAx"; then
            echo "Error: Proof depends on sorryAx"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "'Nat.smallest_strong_psp_two' depends on axioms: [propext, Classical.choice, Quot.sound]"; then
            echo "Error: Unexpected axioms for smallest_strong_psp_two: $OUTPUT"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "'Nat.strong_psp_2047' depends on axioms: [propext, Classical.choice, Quot.sound]"; then
            echo "Error: Unexpected axioms for strong_psp_2047: $OUTPUT"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "'Nat.smallest_strong_psp_two_three' depends on axioms: [propext, Classical.choice, Quot.sound]"; then
            echo "Error: Unexpected axioms for smallest_strong_psp_two_three: $OUTPUT"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "'Nat.strong_psp_two_three_1373653' depends on axioms: [propext, Classical.choice, Quot.sound]"; then
            echo "Error: Unexpected axioms for strong_psp_two_three_1373653: $OUTPUT"
            exit 1
          fi
          echo "All kernel axioms verified successfully!"
