name: Lean 4 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL --retry 5 --retry-connrefused https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean & Lake Toolchain
        run: |
          lean --version
          lake --version

      - name: Fetch Mathlib Cache
        run: lake exe cache get

      - name: Lake Build
        run: lake build

      - name: Strict Verification of Carmichael.lean
        run: lake env lean -D warningAsError=true Carmichael.lean

      - name: Kernel Axioms Verification
        run: |
          OUTPUT=$(lake env lean --stdin << 'EOF'
          import Carmichael
          #print axioms carmichael_561
          EOF
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "sorryAx"; then
            echo "Error: Proof depends on sorryAx"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "Nat.carmichael_561"; then
            echo "Error: Theorem Nat.carmichael_561 was not verified in axiom check"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "'Nat.carmichael_561' depends on axioms: [propext, Classical.choice, Quot.sound]"; then
            echo "Error: Theorem Nat.carmichael_561 depends on unexpected axioms: $OUTPUT"
            exit 1
          fi
